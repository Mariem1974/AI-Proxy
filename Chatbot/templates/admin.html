<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AI-Proxy Admin</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="page">

  <header class="topbar">
    <div class="brand">
      <div class="logo">A</div>
      <div>
        <div class="brand-title">AI-Proxy Admin</div>
        <div class="brand-subtitle">Security Controls</div>
      </div>
    </div>
  </header>

  <div class="warning">
    Toggle security features live to test chatbot protection.
  </div>

  <div class="composer" style="display:grid; gap:10px;">
    <!-- spaCy Toggle -->
    <button class="btn primary" onclick="toggleSpacy()">
      spaCy Firewall:
      <span id="spacy-status">
        {{ "ON" if features["SPACY_FIREWALL"] else "OFF" }}
      </span>
    </button>

    <!-- BERT Toggle -->
    <button class="btn primary" onclick="toggleBert()">
      BERT Firewall:
      <span id="bert-status">
        {{ "ON" if features["BERT_FIREWALL"] else "OFF" }}
      </span>
    </button>

    <!-- PII Toggle -->
    <button class="btn primary" onclick="togglePii()">
      PII Firewall:
      <span id="pii-status">
        {{ "ON" if features["PII_FIREWALL"] else "OFF" }}
      </span>
    </button>


    <!-- Chat Link -->
    <a href="/" class="btn ghost">Go to Chat</a>
  </div>

</div>

<script>
// ---------------------- spaCy ----------------------
async function toggleSpacy() {
  const res = await fetch("/toggle/spacy", {method: "POST"});
  const data = await res.json();
  document.getElementById("spacy-status").innerText =
    data.SPACY_FIREWALL ? "ON" : "OFF";
}

// ---------------------- BERT ----------------------
async function toggleBert() {
  const res = await fetch("/toggle/bert", {method: "POST"});
  const data = await res.json();
  document.getElementById("bert-status").innerText =
    data.bert ? "ON" : "OFF";
}

// ---------------------- PII ----------------------
async function togglePii() {
  const res = await fetch("/toggle/pii", {method: "POST"});
  const data = await res.json();
  document.getElementById("pii-status").innerText =
    data.pii ? "ON" : "OFF";
}

</script>

</body>
</html>
